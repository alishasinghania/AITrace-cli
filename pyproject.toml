[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitrace-cli"
version = "0.1.0"
description = "AI Bill of Materials and Security Scanner for AI/LLM applications"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["ai", "security", "llm", "sbom", "supply-chain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.12.3",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
verify = [
    "litellm>=1.40.0",
    "keyring>=24.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "ruff>=0.4.0",
]

[project.scripts]
aitrace = "aitrace_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
