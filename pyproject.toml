[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aitrace-cli"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["typer>=0.12.3", "PyYAML>=6.0.2"]

[project.scripts]
aitrace = "aitrace_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
