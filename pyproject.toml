[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aitrace-cli"
version = "0.1.0"
description = "Cross-file attack path analysis and exploit synthesis for AI applications."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Alisha Singhania"},
]
keywords = [
    "ai",
    "attack-path",
    "exploit",
    "llm",
    "mcp",
    "sbom",
    "static-analysis",
    "aitrace",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12.3",
    "PyYAML>=6.0.2",
]

[project.optional-dependencies]
verify = [
    "litellm>=1.40.0",
    "keyring>=24.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "ruff>=0.4.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.urls]
Homepage = "https://github.com/alishasinghania/AITrace-cli"
Repository = "https://github.com/alishasinghania/AITrace-cli"
Issues = "https://github.com/alishasinghania/AITrace-cli/issues"
Documentation = "https://github.com/alishasinghania/AITrace-cli#readme"

[project.scripts]
aitrace = "aitrace_cli:main"

[tool.setuptools]
py-modules = ["aitrace_cli"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
