name: Tests

on:
  push:
    branches: [main, "refactor/**", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    # ubuntu-latest is 26.04; setup-python has no 3.9 build for that image.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Smoke test scan
        run: |
          PYTHONPATH=src python3 -m aitrace_cli scan . --no-open
          test -f aitrace-report.html
          test ! -f aitrace-risk-report.md
